# Integração contínua: a cada push ou pull request, compila, testa e sobe o sistema em contêineres.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um push novo no mesmo branch cancela a execução anterior ainda em andamento.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build + 76 testes)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Os testes de integração precisam de um SQL Server. A senha é gerada a cada execução
      # (nenhum segredo no repositório) e mascarada nos logs.
      - name: Subir SQL Server temporário
        run: |
          SENHA="Ci!$(openssl rand -hex 12)Aa1"
          echo "::add-mask::$SENHA"
          docker run -d --name sqlserver -p 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_PID=Express -e "MSSQL_SA_PASSWORD=$SENHA" \
            mcr.microsoft.com/mssql/server:2025-latest
          for i in $(seq 1 60); do
            if docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SENHA" -C -b -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server pronto após ${i}x5s"; break
            fi
            sleep 5
          done
          docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SENHA" -C -b -Q "SELECT @@VERSION"
          echo "JPHELPDESK_TESTES_CONNECTION=Server=localhost,1433;Database=JpHelpDesk_Testes;User Id=sa;Password=$SENHA;TrustServerCertificate=True" >> "$GITHUB_ENV"

      - name: Restaurar
        run: dotnet restore backend/JpHelpDesk.slnx

      - name: Compilar (avisos tratados como erro)
        run: dotnet build backend/JpHelpDesk.slnx --no-restore --configuration Release -warnaserror

      - name: Testar
        run: dotnet test --solution backend/JpHelpDesk.slnx --no-build --configuration Release

  frontend:
    name: Frontend (58 testes + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/jp-help-desk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/jp-help-desk/package-lock.json

      - name: Instalar dependências (exatamente as do package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Testar
        run: npx ng test --watch=false

      - name: Build de produção
        run: npx ng build --configuration production

  docker:
    name: Docker (imagens + compose + smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Segredos descartáveis só para esta execução (o .env real nunca vai para o Git).
      - name: Gerar .env de teste
        run: |
          SQL="Ci!$(openssl rand -hex 12)Aa1"
          SENHA="Teste!$(openssl rand -hex 8)Aa1"
          echo "::add-mask::$SQL"
          echo "::add-mask::$SENHA"
          {
            echo "SQL_SA_PASSWORD=$SQL"
            echo "JWT_CHAVE_SECRETA=$(openssl rand -base64 64 | tr -d '\n')"
            echo "SENHA_USUARIOS_TESTE=$SENHA"
          } > .env
          echo "SENHA_TESTE=$SENHA" >> "$GITHUB_ENV"

      - name: Construir e subir (docker compose)
        run: docker compose up --detach --build --wait --wait-timeout 300

      - name: Smoke test pelo nginx (http://localhost:8080)
        run: |
          set -euo pipefail
          BASE=http://localhost:8080

          echo "1. Health check (nginx -> API)"
          for i in $(seq 1 30); do curl -fsS "$BASE/api/health" && break; sleep 5; done
          curl -fsS "$BASE/api/health" > /dev/null

          echo "2. Rota do Angular devolve o index.html (fallback da SPA)"
          curl -fsS "$BASE/chamados/1" | grep -q "<app-root"

          echo "3. Login com o usuário de teste criado pelo seed"
          TOKEN=$(curl -fsS -X POST "$BASE/api/auth/login" -H "Content-Type: application/json" \
            -d "{\"email\":\"admin@jphelpdesk.com\",\"senha\":\"$SENHA_TESTE\"}" | jq -r .token)
          test -n "$TOKEN" && test "$TOKEN" != "null"

          echo "4. Banco criado pelas migrations, com os 24 chamados de demonstração"
          TOTAL=$(curl -fsS "$BASE/api/chamados" -H "Authorization: Bearer $TOKEN" | jq .totalItens)
          echo "totalItens=$TOTAL"
          test "$TOTAL" -eq 24

          echo "5. Sem token: 401 em problem+json"
          test "$(curl -s -o /dev/null -w '%{http_code}' "$BASE/api/chamados")" -eq 401

          echo "Smoke test OK"

      - name: Logs dos contêineres (em caso de falha)
        if: failure()
        run: docker compose logs --no-color

      - name: Derrubar ambiente
        if: always()
        run: docker compose down --volumes
