# Serve o Angular e encaminha /api para o contêiner da API (mesma origem: sem CORS).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Não informa a versão do nginx nas respostas.
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API, documentação e health check: repassados ao contêiner "api" (rede interna do compose).
    location ~ ^/(api|openapi|swagger)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # IP real de quem acessou: a API usa no limite de tentativas de login.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome (main-ABC123.js) nunca mudam: cache longo.
    location ~* \.(?:js|css|woff2?|ico|png|svg)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Rotas do Angular (/chamados/12, /perfil...) não existem como arquivo: devolve o index.html.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri/ /index.html;
    }
}
